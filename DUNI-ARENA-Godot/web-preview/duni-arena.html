<title>DUNI ARENA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen game canvas; a loading card sits over it until the engine starts. */
:root {
  --bg: #0a0e18; --panel: #131a2b; --line: #36446a; --fg: #eef1fa; --muted: #9aa5c2; --amber: #ffb15c; --gold: #ffd98c; --danger: #ff8088;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; font-family: var(--body); }
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; z-index: 2; }
.card { width: min(360px, 100%); display: grid; gap: 14px; text-align: center; }
.mark { font-family: var(--display); font-weight: 800; font-size: 48px; letter-spacing: .01em; line-height: 1; }
.mark span { color: var(--amber); }
.kicker { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .14em; color: var(--gold); }
.bar { height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s; }
#msg { font-size: 13px; color: var(--muted); min-height: 1.4em; }
#msg.err { color: var(--danger); }
button { justify-self: center; font: inherit; font-weight: 700; color: #29211b; background: var(--amber); border: 0; border-radius: 10px; padding: 12px 28px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans+KR:wght@400;700&display=swap">

<canvas id="canvas" tabindex="0">브라우저가 canvas를 지원하지 않습니다.</canvas>
<div id="boot">
  <div class="card">
    <div class="kicker">TOWER OF FIFTEEN FLOORS</div>
    <div class="mark">DUNI <span>ARENA</span></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div id="msg" role="status">게임 엔진을 불러오는 중…</div>
    <button id="start" type="button" hidden>게임 시작</button>
  </div>
</div>
<script>
// Artifact hosting serves neither .pck nor .gz, so both ship as base64 text.
// Hand Godot the original bytes (the engine binary is also gunzipped). The pack is larger
// than one hosted file may be, so it ships in PCK_PARTS pieces joined back in order.
const PCK_PARTS = 4;
(function () {
  const realFetch = window.fetch.bind(window);
  function bytes(name) {
    return realFetch(name).then(function (res) {
      if (!res.ok) throw new Error(name + ' 를 불러오지 못했습니다 (' + res.status + ')');
      return res.text();
    }).then(function (text) {
      const raw = atob(text.trim());
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    });
  }
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (/(^|\/)index\.wasm(\?|$)/.test(url)) {
      return bytes('index-wasm-gz.txt').then(function (gz) {
        const body = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    if (/(^|\/)index\.pck(\?|$)/.test(url)) {
      const parts = [];
      for (let i = 0; i < PCK_PARTS; i++) parts.push(bytes('index-pck-' + i + '.txt'));
      return Promise.all(parts).then(function (pieces) {
        return new Response(new Blob(pieces), { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
      });
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34178568,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
(function () {
  const bar = document.getElementById('bar');
  const msg = document.getElementById('msg');
  const boot = document.getElementById('boot');
  const start = document.getElementById('start');
  function fail(err) {
    console.error(err);
    msg.textContent = '게임을 시작하지 못했습니다. ' + (err && err.message ? err.message : String(err));
    msg.className = 'err';
  }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail(new Error('이 브라우저에 필요한 기능이 없습니다: ' + missing.join(', '))); return; }
  const engine = new Engine(GODOT_CONFIG);
  // Sound can only start after a tap, so the engine launches from the button.
  engine.init(GODOT_CONFIG.executable).then(function () {
    bar.style.width = '100%';
    msg.textContent = '준비 완료';
    start.hidden = false;
    start.focus();
  }, fail);
  start.addEventListener('click', function () {
    start.hidden = true;
    msg.textContent = '게임 데이터를 여는 중…';
    engine.startGame({
      onProgress: function (current, total) { if (total > 0) bar.style.width = Math.round(current / total * 100) + '%'; }
    }).then(function () { boot.remove(); document.getElementById('canvas').focus(); }, fail);
  });
})();
</script>
